<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trillian</title>
<style>
:root{--bg:#0b1020;--p:#121a30;--p2:#1a2440;--b:#2a3659;--t:#f2e9d8;--m:#8f9bb8;--a:#ffb347;--g:#5be3a0;--r:#ff6b6b;--y:#ffd166;--stars:radial-gradient(1px 1px at 12% 18%,rgba(255,255,255,.4),transparent),radial-gradient(1.5px 1.5px at 68% 32%,rgba(255,255,255,.3),transparent),radial-gradient(1px 1px at 40% 75%,rgba(255,255,255,.35),transparent),radial-gradient(1px 1px at 88% 82%,rgba(255,255,255,.3),transparent);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f5efe0;--p:#fffaf0;--p2:#efe6d0;--b:#d8cba8;--t:#2b2a33;--m:#7a7365;--a:#c2570c;--g:#1a7f4b;--r:#c0392b;--y:#9a6700;--stars:none}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t);font:14px/1.5 'Avenir Next','Trebuchet MS',system-ui,sans-serif}
#app{display:flex;height:100%}
nav{width:190px;background:var(--p);border-right:1px solid var(--b);padding:12px 8px;display:flex;flex-direction:column;gap:2px;flex-shrink:0;overflow-y:auto}
nav h1{font:700 17px ui-monospace,monospace;letter-spacing:.08em;color:var(--a);margin:4px 8px 14px}nav h1 .small{font:11px system-ui;letter-spacing:0}
nav a{padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--m)}
nav a:hover{background:var(--p2)}nav a.on{background:var(--p2);color:var(--a)}
nav .sp{flex:1}
main{flex:1;overflow:auto;padding:18px;min-width:0;background-image:var(--stars)}
h2{margin:0 0 14px;font:600 18px ui-monospace,monospace;letter-spacing:.04em}h3{margin:0 0 8px;font-size:13px;color:var(--m);text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--p);border:1px solid var(--b);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:240px}
select,input,textarea,button{background:var(--p2);color:var(--t);border:1px solid var(--b);border-radius:6px;padding:6px 10px;font:inherit}
button{cursor:pointer}button.pri{background:var(--a);color:#1b1300;font-weight:600;border-color:var(--a)}
textarea{width:100%;font-family:ui-monospace,monospace;font-size:12px}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--b);white-space:nowrap}th{color:var(--m);font-weight:500}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;background:var(--p2);border:1px solid var(--b);margin-right:4px}
.ok{color:var(--g)}.bad{color:var(--r)}.warn{color:var(--y)}.mut{color:var(--m)}
.bar{height:8px;background:var(--p2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}
.chat{display:flex;gap:12px;height:calc(100% - 40px)}
.convs{width:190px;flex-shrink:0}.convs div{padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--m)}.convs div.on,.convs div:hover{background:var(--p2);color:var(--t)}
.ag{padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--m)}.ag.on,.ag:hover{background:var(--p2);color:var(--t)}.convs .ag div{padding:0}.hd>*{min-width:0!important;flex:none!important}
.sn{cursor:pointer;border-radius:3px;padding:1px 0}.sn.sel,.cc.sel{outline:2px solid var(--a)}
.ct{color:var(--a);cursor:pointer;margin-left:2px}mark{background:rgba(210,153,34,.35);color:inherit;border-radius:3px;padding:0 2px}
.thread{flex:1;display:flex;flex-direction:column;min-width:0}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.m{max-width:80%;padding:8px 12px;border-radius:10px;background:var(--p);border:1px solid var(--b)}
.m.u{align-self:flex-end;background:var(--a);color:#1b1300;border-color:var(--a)}
.small{font-size:11px;color:var(--m);margin-top:4px}
.inp{display:flex;gap:8px}.inp input{flex:1}
pre{margin:0;background:var(--p2);padding:10px;border-radius:6px;overflow-x:auto;font-size:12px}
.add{color:var(--g)}.del{color:var(--r)}
.node{fill:var(--p2);stroke:var(--a)}svg text{fill:var(--t);font-size:12px}
.dp{border:2px solid var(--a);color:var(--a);border-radius:999px;padding:4px 8px;text-align:center;font:700 11px ui-monospace,monospace;letter-spacing:.12em;margin:8px 4px}
@media(max-width:700px){nav{width:64px}nav a{font-size:0}nav a:before{content:attr(data-i);font-size:16px}nav h1,.convs,.dp{display:none}}
</style></head><body>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<script>
const $=s=>document.querySelector(s);
const P={
chat(){return `<h2>Chat</h2><div class="chat"><div class="convs card" style="overflow:auto"><h3>Agents</h3>${Object.entries(AG).map(([a,c])=>`<div class="ag" data-a="${a}" onclick="pick('${a}')">🤖 ${a}<div class="small">${c.chats.length} chats</div></div>`).join('')}<div id="hist"></div></div>
<div class="thread"><div class="row hd" style="flex:none;margin-bottom:8px;gap:8px"><select id="col">${COLS.map(c=>`<option>${c}</option>`).join('')}</select><select id="pv" onchange="mdl()"><option>Groq</option><option>OpenRouter</option><option>NVIDIA NIM</option></select><select id="md"></select><span class="tag">ctx 2.1k / 8k</span></div>
<div class="small" id="agt" style="margin-bottom:8px"></div>
<div class="msgs" id="msgs"><div class="m u">Does aspirin lower cancer risk?</div><div class="m"><details><summary class="small">🔧 2 tool calls · 1.9s</summary><div class="small">1. vector_search(scifact-v2, k=5) → 5 chunks (ref art-41)<br>2. rerank → kept 3 · <span class="ok">Open in Phoenix ↗</span></div></details>Daily low-dose aspirin is linked to fewer colorectal cancers <a class="ct" onclick="src(1)">[1]</a><a class="ct" onclick="src(2)">[2]</a>, with benefit appearing after about five years <a class="ct" onclick="src(3)">[3]</a>. Bleeding risk rises in older adults <a class="ct" onclick="src(2)">[2]</a>.<div class="small">✔ 4/4 claims supported · 0.8s · scifact-v2 · <a class="ct" onclick="src(0)">All sources</a> · 👍 👎</div></div></div>
<details class="card"><summary>Context breakdown</summary><div style="margin-top:8px">${[['System prompt (rag.answer v2)',320],['Summary',410],['Recent messages',900],['Tool output (ref)',60]].map(([k,v])=>`<div class="small">${k} · ${v} tok</div><div class="bar"><i style="width:${v/12}%"></i></div>`).join('')}</div></details>
<div class="inp"><input id="q" placeholder="Ask something..." onkeydown="if(event.key=='Enter')send()"><button class="pri" onclick="send()">Send</button></div></div><div class="card" id="srcp" style="width:300px;flex-shrink:0;overflow:auto"></div></div>`},
agents(){const T=[['vector_search','Search an ingested collection','collection, k'],['web_search','Search the web','query'],['calculator','Evaluate math','expression'],['sql_query','Read-only SQL','query'],['python_exec','Sandboxed Python','code'],['big_result_demo','Returns big output by reference','n_rows']];
return `<h2>Agents</h2><div class="row"><div class="card" style="max-width:230px"><h3>Agents</h3>${Object.entries(AG).map(([a,c],i)=>`<div class="ag ${i?'':'on'}">🤖 ${a}<div class="small">${c.prompt} · ${c.tools.length} tools</div></div>`).join('')}<button class="pri" style="width:100%;margin-top:8px">+ New agent</button></div>
<div class="card" style="flex:2"><h3>Edit agent</h3><label>Name<br><input value="Researcher"></label><br><br><div class="row" style="gap:8px"><label>System prompt<br><select><option>rag.answer v2</option><option>rag.answer v1</option><option>chat.system v3</option></select></label><label>Default model<br><select><option>Groq · llama-3.1-8b-instant</option><option>OpenRouter · qwen3-8b:free</option></select></label><label>Chat default collection<br><select>${COLS.map(c=>`<option ${c.startsWith('scifact-v2')?'selected':''}>${c}</option>`).join('')}</select></label></div><br><label>Max steps<br><input value="5" style="width:80px"></label>
<h3 style="margin-top:14px">Tools</h3>${T.map((t,i)=>`<label style="display:block;padding:6px 0;border-bottom:1px solid var(--b)"><input type="checkbox" style="padding:0" ${i<3?'checked':''}> <b>${t[0]}</b> <span class="mut">· ${t[1]} · args: ${t[2]}</span></label>`).join('')}<div class="card" style="margin-top:10px"><h3>vector_search config</h3><div class="row hd" style="gap:8px"><label>Collection<br><select>${COLS.map(c=>`<option ${c.startsWith('scifact-v2')?'selected':''}>${c}</option>`).join('')}</select></label><label>Retrieval profile<br><select><option>hybrid-rerank-k8</option><option>dense-k5</option><option>hybrid-mmr-k8</option></select></label><label>Profile version<br><select><option>pin v2</option><option>follow latest</option></select></label></div><div class="small ok" style="margin-top:6px">✔ Compatible: collection has dense vectors + BM25 index</div><div class="small">+ Add another vector_search (e.g. notes collection)</div></div><br><button class="pri">Save agent</button> <button>Test in chat</button></div></div>`},
models(){const R=[['Groq','llama-3.1-8b-instant','tools,json','ok','28/30 req · 14k tok','42s'],['Groq','llama-3.3-70b','tools,json','ok','9/30 req · 5k tok','42s'],['OpenRouter','qwen/qwen3-8b:free','tools','warn','slow','-'],['OpenRouter','llama-3.2-11b-vision','vision,tools','ok','--','-'],['NVIDIA NIM','meta/llama-3.1-70b','tools,json','ok','38/40 rpm','12s'],['NVIDIA NIM','nv-embed-v1','embed','bad','unavailable','-']];
return `<h2>Models</h2><div class="card tbl"><table><tr><th>Provider</th><th>Model</th><th>Capabilities</th><th>Status</th><th>Rate limit left</th><th>Resets</th><th></th></tr>${R.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2].split(',').map(t=>`<span class="tag">${t}</span>`).join('')}</td><td class="${r[3]}">●</td><td>${r[4]}</td><td>${r[5]}</td><td><button>Set default</button></td></tr>`).join('')}</table></div>`},
prompts(){return `<h2>Prompts</h2><div class="row"><div class="card" style="max-width:220px"><h3>Prompts</h3><div>▸ chat.system</div><div class="mut">▸ rag.answer</div><div class="mut">▸ rewrite.query</div><div class="mut">▸ judge.faithful</div></div>
<div class="card" style="flex:3"><h3>chat.system · v3</h3><textarea rows="9">You are a concise assistant.\nToday: {{date}}\nRules:\n- Cite sources as [n]\n- Answer in {{language}}\n\nOutput schema:\n{"answer": "string", "confidence": 0.0}</textarea><div style="margin:8px 0"><button class="pri">Save as v4</button> <button>Rollback…</button></div>
<h3>Diff v2 → v3</h3><pre><span class="del">- You are a helpful assistant.</span>\n<span class="add">+ You are a concise assistant.</span>\n<span class="add">+ - Cite sources as [n]</span></pre>
<h3 style="margin-top:10px">History</h3><div class="small">v3 · today · used in 12 traces<br>v2 · yesterday · 40 traces<br>v1 · 3 days ago</div></div></div>`},
ingest(){return `<h2>Ingestion</h2><div class="row"><div class="card"><h3>Ingestion profile</h3><div class="row hd" style="gap:8px"><input value="rec-512-bge" style="width:140px"><select><option>load saved…</option><option>rec-512-bge</option><option>rec-256-minilm</option><option>parent-child-bge</option></select><button>Save profile</button></div><br><div class="row" style="gap:8px"><label>Chunk size<br><input value="512"></label><label>Overlap<br><input value="64"></label></div><br><label>Strategy<br><select><option>recursive</option><option>fixed</option><option>sentence</option><option>semantic</option><option>parent-child</option></select></label><br><br><label>Embedding model<br><select><option>bge-small-en (384d)</option><option>MiniLM-L6 (384d)</option></select></label><br><br><label><input type="checkbox" checked style="padding:0"> Skip cached chunks</label><br><label><input type="checkbox" checked style="padding:0"> Detect duplicates</label><br><br><button class="pri">Ingest → new collection version</button></div>
<div class="card"><h3>Upload</h3><div style="border:2px dashed var(--b);padding:28px;text-align:center;border-radius:8px" class="mut">Drop files here · scifact.jsonl</div><br><h3>Jobs</h3><div class="small">scifact · 3,120 / 5,183 chunks</div><div class="bar"><i style="width:60%"></i></div><div class="small" style="margin-top:8px">notes.md · done</div><div class="bar"><i style="width:100%;background:var(--g)"></i></div></div></div>
<div class="card tbl"><h3>Collection versions (ingestion experiments)</h3><table><tr><th></th><th>Version</th><th>Strategy</th><th>Chunk/overlap</th><th>Embed model</th><th>Chunks</th><th>Dups/cache</th><th>Time</th><th>recall@5</th></tr><tr><td><input type="checkbox" checked style="padding:0"></td><td>scifact-v1<div class="small">profile rec-512-bge v1</div></td><td>recursive</td><td>512/64</td><td>bge-small (384d)</td><td>5,183</td><td>41 / 0</td><td>6m 10s</td><td>0.61</td></tr><tr><td><input type="checkbox" checked style="padding:0"></td><td>scifact-v2<div class="small">profile rec-256-minilm v1</div></td><td>recursive</td><td>256/32</td><td>MiniLM-L6 (384d)</td><td>9,870</td><td>41 / 5,100</td><td>1m 20s</td><td class="ok">0.66 ▲</td></tr><tr><td><input type="checkbox" style="padding:0"></td><td>scifact-v3<div class="small">profile parent-child-bge v1</div></td><td>parent-child</td><td>128→512</td><td>bge-small (384d)</td><td>5,183 + 1,700</td><td>41 / 5,183</td><td>0m 50s</td><td class="mut">not run</td></tr></table><br><button onclick="go('chunks')">View chunks</button> <button>Compare selected</button> <button>Delete</button> <span class="small">Each version is its own vector collection; chat, agents and RAG pick one.</span></div>
<div class="card tbl"><h3>Chunks</h3><table><tr><th>ID</th><th>Source</th><th>Tokens</th><th>Flag</th><th>Text</th></tr><tr><td>c-001</td><td>scifact/4983</td><td>498</td><td></td><td>Microstructural development of human newborn…</td></tr><tr><td>c-002</td><td>scifact/5836</td><td>512</td><td class="warn">near-dup</td><td>Aspirin intake and colorectal cancer risk…</td></tr><tr><td>c-003</td><td>notes.md</td><td>120</td><td class="ok">cache hit</td><td>Remember to pin langchain version…</td></tr></table></div>`},
chunks(){return `<h2>Chunks</h2><div class="card"><div class="row hd" style="gap:8px"><select id="cc" onchange="drawC()">${Object.keys(CH).map(c=>`<option>${c}</option>`).join('')}</select><select><option>scifact/4983 · aspirin.txt</option><option>scifact/5836</option><option>notes.md</option></select><span class="tag" id="cs"></span></div></div>
<div class="row"><div class="card" style="flex:3"><h3>Document · colored by chunk · dashed underline = overlap</h3><div id="doc" style="line-height:2"></div></div><div class="card" style="flex:2;max-height:420px;overflow:auto"><h3>Chunks</h3><div id="cl"></div></div></div>
<div class="row"><div class="card"><h3>Token size per chunk</h3><div id="hs"></div></div><div class="card"><h3>Embedding map (2D projection)</h3><svg id="mp" viewBox="0 0 300 160" width="100%"></svg></div></div>`},
profiles(){const I=[['rec-512-bge','recursive · 512/64 · bge-small · dedupe + cache','v1','scifact-v1'],['rec-256-minilm','recursive · 256/32 · MiniLM · dedupe + cache','v1','scifact-v2'],['parent-child-bge','parent-child · 128→512 · bge-small','v1','scifact-v3']];
const R=[['dense-k5','dense(5) → threshold 0.3','v1','Tutor'],['hybrid-rerank-k8','dense(20) + bm25(20) → RRF → cross-encoder → top 8','v2','Researcher'],['hybrid-mmr-k8','dense(20) + bm25(20) → RRF → MMR λ0.5 → top 8','v1','—']];
const T=(h,r,b)=>`<div class="card tbl"><h3>${h}</h3><table><tr><th>Name</th><th>Settings</th><th>Version</th><th>${b}</th><th></th></tr>${r.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td><span class="tag">${x[2]}</span></td><td>${x[3]}</td><td><button>Edit → new version</button></td></tr>`).join('')}</table></div>`;
return `<h2>Profiles</h2><div class="small" style="margin-bottom:10px">Ingestion profile → collection version ┐ &nbsp; Retrieval profile ┴ → vector_search tool → agent</div>${T('Ingestion profiles',I,'Built collections')}${T('Retrieval profiles',R,'Used by agents')}<div class="card"><h3>Stage builder · hybrid-rerank-k8 (editing → v3)</h3>${[['Before search','query rewrite','off','LLM · cached',0],['Search','dense','k = 20','local',1],['Search','bm25','k = 20','local',1],['After search','RRF fusion','k = 60','local',1],['After search','cross-encoder rerank','MiniLM · keep 8','local CPU',1]].map((x,i)=>`<div class="row hd" style="gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--b);opacity:${x[4]?1:.5}"><span class="mut" style="width:18px">${i+1}</span><span class="tag" style="width:100px;text-align:center">${x[0]}</span><b style="width:150px">${x[1]}</b><input value="${x[2]}" style="width:150px"><span class="tag ${x[3].startsWith('LLM')?'warn':''}">${x[3]}</span><button>↑</button><button>↓</button><button>✕</button></div>`).join('')}<div class="row hd" style="gap:8px;margin-top:10px"><select><option>+ Add stage…</option><optgroup label="Before search"><option>query rewrite</option><option>HyDE</option><option>multi-query</option><option>decomposition</option><option>step-back</option></optgroup><optgroup label="Search"><option>dense</option><option>bm25</option><option>metadata filter</option><option>time-aware</option></optgroup><optgroup label="After search"><option>RRF fusion</option><option>cross-encoder rerank</option><option>MMR</option><option>score threshold</option><option>context pruning</option><option>passage compression</option></optgroup></select><button>Dry run on 1 question</button><button class="pri">Save as v3</button></div><div class="small" style="margin-top:8px">Every stage takes (queries, candidates) and returns (queries, candidates). LLM stages are cached. Loops like Corrective RAG or Self-RAG belong in the agent graph.</div></div>
<div class="card"><span class="warn">⚠ Compatibility:</span> hybrid-* profiles need a BM25 text index. scifact-v3 (parent-child) has none yet.</div>`},
rag(){const col=n=>`<div class="card"><h3>Config ${n}</h3><select style="width:100%;margin-bottom:6px">${COLS.slice(1).map((c,i)=>`<option ${(n=='A')==(i==0)?'selected':''}>${c}</option>`).join('')}</select><div class="small">top-k ${n=='A'?5:8} · ${n=='A'?'dense':'hybrid + rerank'}</div><br><h3>Retrieved</h3>${[[.82,'Aspirin reduces risk of…'],[.74,'Colorectal screening…'],[.61,'NSAID trials show…']].map(([s,t],i)=>`<div class="small">[${i+1}] score ${(s-(n=='A'?0:-.05)).toFixed(2)} · ${t}</div><div class="bar"><i style="width:${s*100}%"></i></div>`).join('')}<br><h3>Final prompt</h3><pre>System: Answer from context…\nContext: [1]… [2]…\nQ: Does aspirin lower cancer risk?</pre><br><h3>Answer</h3><div>Evidence suggests aspirin lowers colorectal cancer risk [1][2].</div><div class="small">recall@5 ${n=='A'?'0.61':'0.68'} · 1.2k tok · <span class="ok">open in Phoenix ↗</span></div><div class="row hd" style="gap:6px;margin-top:8px"><input value="${n=='A'?'dense-k5':'hybrid-rerank-k8'}" style="width:150px"><button>Save as retrieval profile</button></div></div>`;
return `<h2>RAG playground</h2><div class="card"><div class="row" style="gap:8px"><input style="flex:3" value="Does aspirin lower cancer risk?"><button class="pri" style="flex:none">Run both</button></div></div><div class="row">${col('A')}${col('B')}</div><div class="card"><h3>Config B · stage waterfall</h3>${[['dense',20,'18ms'],['bm25',20,'6ms'],['RRF fusion',28,'1ms'],['cross-encoder',8,'240ms']].map(([n,c,t])=>`<div class="small">${n} · ${c} candidates · ${t}</div><div class="bar"><i style="width:${c*3}%"></i></div>`).join('')}<div class="tbl" style="margin-top:10px"><table><tr><th>Chunk</th><th>dense rank</th><th>bm25 rank</th><th>after RRF</th><th>after rerank</th></tr>${[['c-0412',3,9,2,1],['c-0077',14,1,4,2],['c-0305',1,22,3,3],['c-0951','—',2,5,0]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]?r[4]+(r[3]>r[4]?' <span class="ok">▲'+(r[3]-r[4])+'</span>':''):'<span class="bad">dropped</span>'}</td></tr>`).join('')}</table></div><div class="small">c-0077 ranked 14th in dense, 1st in BM25, and the reranker moved it to 2nd. This is what each stage buys you.</div></div>`},
evals(){return `<h2>Evals</h2><div class="row"><div class="card"><h3>Datasets</h3><div>scifact-50 <span class="tag">50 q</span></div><div>hotpot-100 <span class="tag">100 q</span></div><div>unanswerable-30 <span class="tag">30 q</span></div></div>
