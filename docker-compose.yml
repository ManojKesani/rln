name: trillian

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:version-20.19.0
    restart: unless-stopped
    ports:
      - "6006:6006"

  api:
    build: ./apps/api
    image: trillian-api:dev
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./scripts:/app/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
   

  worker:
    image: trillian-api:dev
    restart: unless-stopped
    env_file: .env
    command: ["sleep", "infinity"]
    depends_on:
      redis:
        condition: service_healthy

  web:
    build: ./apps/web
    image: trillian-web:dev
    restart: unless-stopped
    
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web


volumes:
  pgdata: